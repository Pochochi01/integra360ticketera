# Integra360 Ticketera - nginx
# Copiar a /etc/nginx/sites-available/integra360ticketera.com.conf y enlazar en sites-enabled.
#
#   integra360ticketera.com / www          → marketplace (todos los complejos)
#   <complejo>.integra360ticketera.com      → un complejo (el backend lo detecta por X-Forwarded-Host)
#
# Frontend: build estático de Vite en /var/www/integra360ticketera/frontend/dist
# Backend:  Node en 127.0.0.1:4000 (PORT del .env), con /api y /uploads

upstream integra360_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

# HTTP → HTTPS (deja pasar la validación de Let's Encrypt)
server {
    listen 80;
    listen [::]:80;
    server_name integra360ticketera.com www.integra360ticketera.com *.integra360ticketera.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# www → dominio principal
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.integra360ticketera.com;

    ssl_certificate     /etc/letsencrypt/live/integra360ticketera.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/integra360ticketera.com/privkey.pem;

    return 301 https://integra360ticketera.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    # Dominio principal + un subdominio por complejo
    server_name integra360ticketera.com *.integra360ticketera.com;

    # Certificado con el dominio y el comodín (*.integra360ticketera.com): ver deploy/README-deploy.md
    ssl_certificate     /etc/letsencrypt/live/integra360ticketera.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/integra360ticketera.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/integra360ticketera/frontend/dist;
    index index.html;

    # Imágenes de eventos (el backend acepta hasta 3 MB por imagen)
    client_max_body_size 5m;

    # Seguridad. camera=(self): la Portería usa la cámara del propio sitio.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # ---------- API ----------
    location /api/ {
        proxy_pass http://integra360_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # El backend identifica el complejo por el subdominio: tiene que recibir el host original
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Las respuestas de la API nunca se cachean (la Portería valida siempre contra el servidor)
        add_header Cache-Control "no-store" always;
    }

    # ---------- Imágenes subidas (eventos, entradas) ----------
    location /uploads/ {
        proxy_pass http://integra360_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 7d;
    }

    # ---------- PWA ----------
    # El Service Worker y el manifest no se cachean: así los navegadores detectan cada versión nueva
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }
    location = /manifest.json {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # JS/CSS con hash de Vite: caché de un año
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ~* \.(?:png|svg|ico|webp|jpg|jpeg|woff2?)$ {
        expires 30d;
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta (/eventos/3, /porteria, …) carga index.html y la resuelve React
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
